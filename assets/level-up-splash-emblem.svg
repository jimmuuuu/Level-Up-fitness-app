<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">Level Up Fitness opening emblem</title>
  <desc id="desc">A polished silver fitness emblem with an upward arrow launching above a barbell.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".2" stop-color="#f1f2f3"/>
      <stop offset=".5" stop-color="#b9bec4"/>
      <stop offset=".76" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#8d939a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d6269"/>
      <stop offset="1" stop-color="#15171a"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#bfc4ca"/>
      <stop offset=".7" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7d838a"/>
    </linearGradient>
    <style>
      #frame {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: frame-in .34s .04s cubic-bezier(.16,1,.3,1) forwards;
      }
      #accent {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: accent-in .3s .14s ease-out forwards;
      }
      #barbell {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: barbell-react .92s .12s cubic-bezier(.16,1,.3,1) forwards;
      }
      #arrow {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: arrow-launch .74s .25s cubic-bezier(.12,.82,.18,1) forwards;
      }
      @keyframes frame-in {
        0% { opacity: 0; transform: scale(.94); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes accent-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes barbell-react {
        0% { opacity: 0; transform: translateY(0) scaleX(.98); }
        18% { opacity: 1; transform: translateY(0) scaleX(1); }
        43% { opacity: 1; transform: translateY(0) scaleX(1); }
        58% { opacity: 1; transform: translateY(6px) scaleX(1.012); }
        76% { opacity: 1; transform: translateY(-1.5px) scaleX(.998); }
        100% { opacity: 1; transform: translateY(0) scaleX(1); }
      }
      @keyframes arrow-launch {
        0% { opacity: 0; transform: translateY(148px) scaleY(.62); }
        14% { opacity: 1; transform: translateY(140px) scaleY(.68); }
        44% { opacity: 1; transform: translateY(92px) scaleY(.9); }
        66% { opacity: 1; transform: translateY(-16px) scaleY(1.035); }
        82% { opacity: 1; transform: translateY(5px) scaleY(.992); }
        100% { opacity: 1; transform: translateY(0) scaleY(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #frame, #accent, #barbell, #arrow {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </defs>

  <g id="frame">
    <g fill="none" stroke="#111317" stroke-width="26" stroke-linecap="square" stroke-linejoin="miter" opacity=".98" transform="translate(5 7)">
      <path d="M78 164 L240 76"/>
      <path d="M272 76 L434 164"/>
      <path d="M76 338 L240 444"/>
      <path d="M272 444 L436 338"/>
    </g>
    <g fill="none" stroke="url(#silver)" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M74 153 L240 62"/>
      <path d="M272 62 L438 153"/>
      <path d="M72 332 L240 452"/>
      <path d="M272 452 L440 332"/>
    </g>
  </g>

  <g id="accent">
    <g fill="url(#edge)" transform="translate(5 7)">
      <path d="M150 194 L214 144 L214 190 L180 210 Z"/>
      <path d="M362 194 L298 144 L298 190 L332 210 Z"/>
    </g>
    <g fill="url(#silver)">
      <path d="M145 187 L216 132 L216 176 L177 204 Z"/>
      <path d="M367 187 L296 132 L296 176 L335 204 Z"/>
    </g>
  </g>

  <g id="barbell">
    <rect x="100" y="245" width="312" height="22" rx="4" fill="url(#edge)"/>
    <rect x="104" y="247" width="304" height="12" rx="3" fill="url(#silver)"/>
    <g stroke="#181a1d" stroke-width="5">
      <rect x="72" y="232" width="24" height="48" rx="8" fill="url(#plate)"/>
      <rect x="96" y="218" width="30" height="76" rx="10" fill="url(#plate)"/>
      <rect x="124" y="202" width="38" height="108" rx="11" fill="url(#plate)"/>
      <rect x="160" y="216" width="20" height="80" rx="7" fill="url(#plate)"/>
      <rect x="416" y="232" width="24" height="48" rx="8" fill="url(#plate)"/>
      <rect x="386" y="218" width="30" height="76" rx="10" fill="url(#plate)"/>
      <rect x="350" y="202" width="38" height="108" rx="11" fill="url(#plate)"/>
      <rect x="332" y="216" width="20" height="80" rx="7" fill="url(#plate)"/>
    </g>
  </g>

  <g id="arrow">
    <path d="M256 82 L340 174 L296 158 L296 374 L256 432 L216 374 L216 158 L172 174 Z" fill="#0f1114" transform="translate(5 7)"/>
    <path d="M256 74 L340 166 L292 148 L292 369 L256 423 L220 369 L220 148 L172 166 Z" fill="url(#silver)"/>
    <path d="M256 92 L256 411" stroke="#15171a" stroke-width="8"/>
    <path d="M226 162 L226 366" stroke="#ffffff" stroke-opacity=".36" stroke-width="3"/>
    <path d="M286 162 L286 366" stroke="#5a6067" stroke-opacity=".62" stroke-width="3"/>
  </g>
</svg>
